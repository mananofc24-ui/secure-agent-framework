[project]
name = "secure-agent"
version = "1.0.0"
description = "Security framework for agentic AI with tool gateway, HITL, and audit logging"
authors = [
    { name = "Your Name", email = "you@email.com" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",

    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",

    "sqlalchemy==2.0.37",
    "asyncpg==0.30.0",

    # LangChain / LangGraph
    "langgraph==1.2.11",
    "langchain==1.3.18",
    "langchain-core==1.6.1",
    "langchain-openai==1.6.0",

    # Configuration
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",

    # Security / authentication
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.20",

    # Redis / HTTP
    "redis==5.2.0",
    "httpx==0.28.1",

    # Reliability / logging
    "tenacity==9.0.0",
    "structlog==24.4.0",
]


[project.optional-dependencies]

dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.3",
    "mypy==1.14.0",

    # Used by async SQLite test fixtures
    "aiosqlite==0.20.0",
]


[build-system]
requires = [
    "setuptools>=61.0"
]
build-backend = "setuptools.build_meta"


# ---------------------------------------------------------------------------
# Explicit setuptools package discovery
#
# The repository contains top-level directories such as:
#
#   app/
#   attack/
#   policies/
#
# Without explicit discovery setuptools can interpret all of them as Python
# packages and fail with:
#
#   Multiple top-level packages discovered in a flat-layout
#
# Only the actual application package is installed.
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
include = [
    "app*"
]


# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Removes the pytest-asyncio deprecation warning and makes the fixture
# event-loop lifetime explicit.
asyncio_default_fixture_loop_scope = "function"

testpaths = [
    "tests"
]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"


# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true